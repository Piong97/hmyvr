
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Marker AR | Haji Mohammad Yassin VR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .back-button {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 99999;
            padding: 12px 18px;
            background: rgba(7, 29, 26, 0.9);
            border: 1px solid #d7b777;
            border-radius: 8px;
            color: white;
            font: 600 14px Arial, sans-serif;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <a href="ar-cam.html" class="back-button">← Back</a>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;"

        <a-marker preset="hiro">
            <a-box
                position="0 0.5 0"
                width="1"
                height="1"
                depth="1"
                color="red">
            </a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
