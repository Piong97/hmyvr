<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c2724">
    <title>Marker AR | Haji Mohammad Yassin VR</title>

    <!-- Standalone AR.js example: no site CSS, iframe, or custom camera code. -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
        .back-button {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            z-index: 99999;
            display: inline-flex;
            align-items: center;
            padding: 12px 17px;
            border: 1px solid rgba(215,183,119,.6);
            border-radius: 9px;
            background: rgba(7,29,26,.92);
            color: #f6f3ec;
            font: 600 14px Arial, sans-serif;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(0,0,0,.25);
        }
        .back-button:focus-visible { outline: 3px solid #d7b777; outline-offset: 3px; }
    </style>
</head>
<body>
    <a href="ar-cam.html" class="back-button">← Back</a>

    <a-scene embedded vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
            <!-- Phase 1: verify this red cube stays anchored to the Hiro marker. -->
            <a-box position="0 0.5 0" width="1" height="1" depth="1"
                   material="color: #e54848; shader: flat;"></a-box>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
