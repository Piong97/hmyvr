
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>NFT AR | Haji Mohammad Yassin VR</title>

  <!-- Latest A-Frame: test compatibility with AR.js NFT -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- Keep the AR.js NFT build from our working setup -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .back-button {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10001;
      padding: 12px 18px;
      background: rgba(7, 29, 26, 0.9);
      border: 1px solid #d7b777;
      border-radius: 8px;
      color: white;
      font: 600 14px Arial, sans-serif;
      text-decoration: none;
    }

    #status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      width: max-content;
      max-width: 85%;
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font: 14px Arial, sans-serif;
      text-align: center;
    }
  </style>
</head>

<body>
  <a class="back-button" href="ar-cam.html">← Back</a>

  <div id="status" role="status">
    Starting NFT camera...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-nft
      id="nft-marker"
      type="nft"
      url="nft/mosque"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- Red cube: keep this until tracking works -->
      <a-box
        position="50 100 0"
        width="100"
        height="100"
        depth="100"
        color="red">
      </a-box>

    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const marker = document.getElementById('nft-marker');

    window.addEventListener('arjs-nft-loaded', () => {
      status.textContent =
        'NFT ready — scan the reference image';
    });

    marker.addEventListener('markerFound', () => {
      status.textContent = 'Image detected!';
    });

    marker.addEventListener('markerLost', () => {
      status.textContent =
        'Looking for reference image...';
    });

    window.addEventListener('error', event => {
      status.textContent = 'Error: ' + event.message;
    });

    window.addEventListener('unhandledrejection', event => {
      status.textContent =
        'AR error: ' + String(event.reason);
    });
  </script>
</body>
</html>
